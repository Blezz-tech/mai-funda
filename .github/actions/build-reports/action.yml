name: Сборка отчётов
description: >
  Ставит Typst и метрически совместимые шрифты (Liberation) и собирает
  PDF всех лабораторных работ в dist/ через ./build.sh.
  Требует, чтобы репозиторий уже был склонирован (actions/checkout).

inputs:
  typst-version:
    description: Тег релиза Typst на GitHub
    required: false
    default: v0.15.1

runs:
  using: composite
  steps:
    - name: Установить Typst
      shell: bash
      env:
        TYPST_VERSION: ${{ inputs.typst-version }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64)  target=x86_64-unknown-linux-musl ;;
          aarch64) target=aarch64-unknown-linux-musl ;;
          *) echo "Неизвестная архитектура: $(uname -m)" >&2; exit 1 ;;
        esac
        url="https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-${target}.tar.xz"
        curl -fsSL "$url" -o /tmp/typst.tar.xz
        tar -xJf /tmp/typst.tar.xz -C /tmp
        sudo install -m 0755 "/tmp/typst-${target}/typst" /usr/local/bin/typst
        typst --version

    - name: Установить шрифты
      shell: bash
      run: |
        # Liberation Serif/Mono — метрические аналоги Times New Roman
        # и Courier из шаблона lib/lab.typ; Hack — для консоли.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fonts-liberation fonts-hack

    - name: Проверить шрифты
      shell: bash
      run: |
        # Без Liberation Typst молча подставит встроенный шрифт и вёрстка
        # разъедется, поэтому здесь падаем, а не предупреждаем.
        available="$(typst fonts)"
        missing=()
        for font in "Liberation Serif" "Liberation Mono" "Hack"; do
          if grep -qxF "$font" <<<"$available"; then
            echo "ok: $font"
          else
            missing+=("$font")
          fi
        done
        if (( ${#missing[@]} )); then
          echo "::error::Не найдены шрифты: ${missing[*]}"
          exit 1
        fi

    - name: Собрать PDF
      shell: bash
      run: ./build.sh
