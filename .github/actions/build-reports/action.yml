name: Сборка отчётов
description: >
  Ставит Typst и шрифты из шрифтовой цепочки lib/lab.typ (Times New Roman,
  Hack, Liberation), собирает PDF всех лабораторных работ в dist/ через
  ./build.sh и пишет dist/summary.md. Требует, чтобы репозиторий уже был
  склонирован (actions/checkout). Вся логика — в .github/scripts/.

inputs:
  typst-version:
    description: Тег релиза Typst на GitHub
    required: false
    default: v0.15.1
  require-times-new-roman:
    description: >-
      true — падать, если настоящий Times New Roman поставить не удалось
      (иначе будет предупреждение, а текст наберётся метрически совместимым
      Liberation Serif из цепочки lib/lab.typ).
    required: false
    default: "true"

outputs:
  pdf-count:
    description: Сколько PDF собрано
    value: ${{ steps.build.outputs.pdf-count }}

runs:
  using: composite
  steps:
    - name: Установить Typst
      shell: bash
      env:
        TYPST_VERSION: ${{ inputs.typst-version }}
      run: .github/scripts/install-typst.sh

    - name: Установить шрифты
      shell: bash
      env:
        REQUIRE_TIMES: ${{ inputs.require-times-new-roman }}
      run: .github/scripts/install-fonts.sh

    - name: Проверить шрифты
      shell: bash
      env:
        REQUIRE_TIMES: ${{ inputs.require-times-new-roman }}
      run: .github/scripts/check-fonts.sh

    - name: Собрать PDF
      id: build
      shell: bash
      run: |
        set -euo pipefail
        ./build.sh
        .github/scripts/build-summary.sh
        count=$(find dist -maxdepth 1 -name '*.pdf' | wc -l)
        echo "pdf-count=$count" >> "$GITHUB_OUTPUT"
