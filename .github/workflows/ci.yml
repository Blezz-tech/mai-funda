name: CI

# Проверка сборки на каждый коммит в основную ветку и на каждый PR.
# Публичный репозиторий -> GitHub Actions бесплатны, все шаги на
# официальных actions и системных утилитах, сторонних сервисов нет.
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Опечатки в путях и номерах ловятся за секунду, до установки
      # Typst и шрифтов (полная установка занимает пару минут).
      - name: Проверить отчёты без сборки
        run: ./build.sh check

      - name: Typst + шрифты + сборка
        id: build
        uses: ./.github/actions/build-reports

      - name: Загрузить PDF как артефакт
        uses: actions/upload-artifact@v5
        with:
          name: laboratornye-raboty
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Итог в summary
        if: always()
        run: |
          {
            if [ -f dist/summary.md ]; then
              cat dist/summary.md
              echo
            fi
            if [ -n "${{ steps.build.outputs.pdf-count }}" ]; then
              echo "Собрано PDF: ${{ steps.build.outputs.pdf-count }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
