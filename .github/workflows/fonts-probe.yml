name: fonts-probe
on:
  push:
    branches: [arena/adb26c73-mai-funda]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-reports
      - name: Показать шрифты в summary
        run: |
          {
            echo "### typst fonts (фильтр)"
            typst fonts | grep -E "Times New Roman|Hack|Liberation|DejaVu" | sort -u
            echo
            echo "### dist"
            ls -l dist
          } >> "$GITHUB_STEP_SUMMARY"
