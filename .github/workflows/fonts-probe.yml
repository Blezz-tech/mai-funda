name: fonts-probe
on:
  push:
    branches: [arena/adb26c73-mai-funda]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-reports
      - name: Отчёт о шрифтах
        run: |
          fonts=$(typst fonts | grep -E "^(Times New Roman|Hack|Liberation Serif|Liberation Mono)$" | sort -u | tr '\n' ',')
          echo "::notice::typst fonts: $fonts"
          echo "::notice::fc-match Times: $(fc-match 'Times New Roman')"
          echo "::notice::fc-match Hack: $(fc-match 'Hack')"
          for f in dist/*.pdf; do
            echo "::notice::$f -> $(grep -a -o -E 'TimesNewRoman[A-Za-z]*|Hack-[A-Za-z]*|LiberationSerif[A-Za-z]*' "$f" | sort -u | tr '\n' ',')"
          done
