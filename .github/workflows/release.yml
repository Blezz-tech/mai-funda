name: CD

# Релизы с готовыми PDF.
#
#  * push тега v* -> обычный релиз (Latest) с PDF всех работ;
#  * push в main/master -> релиз-сборка на этот коммит (prerelease,
#    Latest не переключается), т.е. «релиз по коммиту».
#
# Публичный репозиторий -> Actions бесплатны. Всё на официальных
# actions и gh CLI из образа раннера, сторонних сервисов нет.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Релиз с PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Проверить отчёты
        run: .github/scripts/check-reports.sh

      - name: Typst + шрифты + сборка
        uses: ./.github/actions/build-reports

      - name: Собрать архив и имена ассетов
        run: python3 .github/scripts/release-assets.py

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          [[ -f lab-reports.zip ]] || { echo "::error::нет lab-reports.zip"; exit 1; }
          [[ -s release-assets/list.txt ]] || { echo "::error::нет release-assets/list.txt"; exit 1; }

          # GitHub переписывает имена ассетов релиза в ASCII
          # («Лабораторная работа 1.pdf» -> «1.pdf»), поэтому:
          #   * архив lab-reports.zip — имена внутри ровно как в dist/;
          #   * lab-N.pdf — те же PDF отдельными файлами с ASCII-именами
          #     и кириллической подписью ассета;
          #   * summary.md — таблица собранных работ.
          assets=(lab-reports.zip)
          while IFS= read -r line; do
            [[ -n $line ]] || continue
            assets+=("$line")
          done < release-assets/list.txt
          assets+=("dist/summary.md#summary.md")

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # Релиз по тегу: v1.0.0 -> Latest
            tag="${GITHUB_REF#refs/tags/}"
            title="Отчёты по лабораторным работам ${tag}"
            create_args=(--generate-notes --title "$title")
          else
            # Релиз по коммиту в основную ветку
            sha="${GITHUB_SHA::7}"
            tag="build-$(date -u +%Y%m%d-%H%M)-${sha}"
            title="Сборка ${sha} от $(date -u +%d.%m.%Y)"
            create_args=(
              --prerelease --latest=false
              --target "$GITHUB_SHA"
              --title "$title"
              --notes-file dist/summary.md
            )
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Релиз $tag уже есть — обновляю файлы"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            echo "Создаю релиз $tag"
            gh release create "$tag" "${assets[@]}" "${create_args[@]}"
          fi

          gh release view "$tag" --json assets -q '.assets[] | "\(.name) <- \(.label)"'
          echo "Готово: https://github.com/${GH_REPO}/releases/tag/${tag}"
