name: CD

# Релизы с готовыми PDF.
#
#  * push тега v* -> обычный релиз (Latest) с PDF всех работ;
#  * push в main/master -> релиз-сборка на этот коммит (prerelease,
#    Latest не переключается), т.е. «релиз по коммиту».
#
# Публичный репозиторий -> Actions бесплатны. Всё на официальных
# actions и gh CLI из образа раннера, сторонних сервисов нет.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Релиз с PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Typst + шрифты + сборка
        uses: ./.github/actions/build-reports

      - name: Собрать архив
        run: |
          set -euo pipefail
          # Единственное место, где имена «Лабораторная работа N.pdf» доживают
          # до скачивания: GitHub переименовывает ассеты релиза в ASCII.
          python3 - <<'PY'
          import pathlib, zipfile

          dist = pathlib.Path("dist")
          pdfs = sorted(dist.glob("*.pdf"))
          if not pdfs:
              raise SystemExit("dist/*.pdf пуст — нечего упаковывать")
          with zipfile.ZipFile("lab-reports.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for pdf in pdfs:
                  zf.write(pdf, arcname=pdf.name)
          print("В архиве:", ", ".join(p.name for p in pdfs))
          PY
          unzip -l lab-reports.zip

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(dist/*.pdf)
          if (( ${#files[@]} == 0 )); then
            echo "Нечего прикладывать к релизу: dist/*.pdf пуст" >&2
            exit 1
          fi

          # GitHub переписывает имена ассетов релиза в ASCII
          # («Лабораторная работа 1.pdf» -> «1.pdf»), поэтому:
          #   * архив lab-reports.zip — имена внутри ровно как в dist/;
          #   * lab-N.pdf — те же PDF отдельными файлами с ASCII-именами
          #     и кириллической подписью ассета.
          assets=(lab-reports.zip)
          mkdir -p release-assets
          for pdf in "${files[@]}"; do
            name="$(basename "$pdf" .pdf)"
            num="${name#Лабораторная работа }"
            num="$(printf '%s' "$num" | tr -cd '0-9a-zA-Z')"
            copy="release-assets/lab-${num}.pdf"
            cp "$pdf" "$copy"
            assets+=("${copy}#${name}")
          done

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # Релиз по тегу: v1.0.0 -> Latest
            tag="${GITHUB_REF#refs/tags/}"
            title="Отчёты по лабораторным работам ${tag}"
            create_args=(--generate-notes --title "$title")
          else
            # Релиз по коммиту в основную ветку
            sha="${GITHUB_SHA::7}"
            tag="build-$(date -u +%Y%m%d-%H%M)-${sha}"
            title="Сборка ${sha} от $(date -u +%d.%m.%Y)"
            create_args=(
              --prerelease --latest=false
              --target "$GITHUB_SHA"
              --title "$title"
              --notes-file dist/summary.md
            )
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Релиз $tag уже есть — обновляю файлы"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            echo "Создаю релиз $tag"
            gh release create "$tag" "${assets[@]}" "${create_args[@]}"
          fi

          gh release view "$tag" --json assets -q '.assets[] | "\(.name) <- \(.label)"'
          echo "Готово: https://github.com/${GH_REPO}/releases/tag/${tag}"
